name: Tu dong cap nhat replacecode
on:
  push:
    paths:
      - 'input/**.pdf' # Chạy khi bạn tải file PDF mới vào thư mục input

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Libraries
        run: pip install pdfplumber pandas openpyxl
        
      - name: Run Extraction Script
        run: python scripts/extract_pdf.py # Đảm bảo file này nằm trong thư mục scripts
        
      - name: Save to Excel
        run: |
          git config --global user.name 'Assistant'
          git config --global user.email 'assistant@github.com'
          git add output/Database_Tong_Hop.xlsx
          git commit -m "Auto-update: Cap nhat du lieu tu PDF moi"
          git push
